name: Update ForexFactory Calendar

on:
  schedule:
    # اجرا هر ۲ ساعت یک‌بار (دقیقه ۷ برای دوری از شلوغی سر ساعت)
    - cron: '7 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and validate ForexFactory JSON
        run: |
          python3 - << 'EOF'
          import json, urllib.request, datetime, os, sys, time

          urls = [
              "https://nfs.faireconomy.media/ff_calendar_thisweek.json",
              "https://nfs.faireconomy.media/ff_calendar_nextweek.json"
          ]
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
              "Accept": "application/json"
          }

          all_events = []
          seen = set()

          for idx, url in enumerate(urls):
              if idx > 0:
                  time.sleep(3)
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      if resp.status == 200:
                          data = json.loads(resp.read().decode("utf-8"))
                          if isinstance(data, list):
                              for ev in data:
                                  key = (ev.get("title", ""), ev.get("country", ""), ev.get("date", ""))
                                  if key not in seen:
                                      seen.add(key)
                                      all_events.append(ev)
              except Exception as e:
                  print(f"Warning fetching {url}: {e}")
                  if idx == 0 and len(all_events) == 0:
                      if os.path.exists("calendar.json"):
                          print("Keeping existing calendar.json due to temporary error.")
                          sys.exit(0)
                      else:
                          sys.exit(1)

          if not all_events:
              if os.path.exists("calendar.json"):
                  sys.exit(0)
              sys.exit(1)

          output = {
              "updatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "count": len(all_events),
              "events": all_events
          }

          with open("calendar.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Saved {len(all_events)} events to calendar.json")
          EOF

      - name: Commit and push updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ForexFactory calendar"
            git push
          fi
